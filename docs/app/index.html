      .search { flex: 1 1 100%; }
      .catalog { padding: 16px 16px 24px; }
      .panel { padding-left: 16px; padding-right: 16px; }

// MMI3GCipher — XOR PRNG matching Harman Becker proc_scriptlauncher
// Verified byte-identical to builder/encoder.py
class MMI3GCipher {
  constructor() {
    this.SEED_INIT = 0x001be3ac >>> 0;
    this.seed = this.SEED_INIT;
  }
  _prng_rand() {
    const r0 = this.seed >>> 0;
    let r1 = ((this.seed >>> 1) | ((this.seed << 31) >>> 0)) >>> 0;
    let r3 = ((((r1 >>> 16) & 0xFF) + r1) >>> 0);
    r1 = ((((r3 >>> 8) & 0xFF) << 16) >>> 0);
    r3 = ((r3 - r1) >>> 0);
    this.seed = r3;
    return r0;
  }
  process(data) {
    this.seed = this.SEED_INIT;
    this._prng_rand();
    const out = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) {
      out[i] = data[i] ^ (this._prng_rand() & 0xFF);
    }
    return out;
  }
}

async function fetchBinary(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return new Uint8Array(await r.arrayBuffer());
}
async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return await r.text();
}
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return await r.json();
}
function safeZipPath(name, stripComponents = 0, target = "") {
  const parts = String(name || "").replaceAll("\\", "/").split("/").filter(Boolean);
  const stripped = parts.slice(stripComponents);
  if (stripped.length === 0) return null;
  if (stripped.some((p) => p === "." || p === "..")) return null;
  const targetParts = String(target || "").replaceAll("\\", "/").split("/").filter(Boolean);
  if (targetParts.some((p) => p === "." || p === "..")) return null;
  return [...targetParts, ...stripped].join("/");
}
function releaseZipUrl(rz) {
  if (typeof rz === "string") return rz;
  if (rz && rz.web_url) return rz.web_url;
  if (rz && rz.url) return rz.url;
  if (rz && rz.base_url && rz.name) return rz.base_url + rz.name;
  throw new Error("Invalid release_zip declaration");
}
async function fetchReleaseZipFiles(rz, onEntry) {
  const url = releaseZipUrl(rz);
  const bytes = await fetchBinary(url);
  if (rz && rz.size && bytes.length !== rz.size) {
    throw new Error(`release ZIP size mismatch: got ${bytes.length}, expected ${rz.size}`);
  }
  const zip = await JSZip.loadAsync(bytes);
  const strip = Math.max(0, Number(rz?.strip_components || 0));
  const target = rz?.target || "";
  const files = [];
  for (const entry of Object.values(zip.files)) {
    if (entry.dir) continue;
    const outPath = safeZipPath(entry.name, strip, target);
    if (!outPath) continue;
    const entryBytes = await entry.async("uint8array");
    files.push({ path: outPath, bytes: entryBytes });
    onEntry && onEntry(outPath);
  }
  return files;
}

/**
 * Generate the combined run.sh installer from selected modules.
 * Mirrors generate_run_sh() in builder/build_sd.py.
 */
function generateRunSh(selected, manifest, overrides) {
  overrides = overrides || {};
  const needsFlashInstall = selected.some((modName) => {
    const meta = manifest.modules[modName];
    return meta && meta.installs_to_flash !== false;
  });
  const lines = [
    "#!/bin/ksh",
    "# ============================================================",
    "# MMI3G-Toolkit - Combined Installer",
    "# Auto-generated by the web SD card builder",
    "# ============================================================",
    "",
    "SDPATH=\"${1:-$(dirname $0)}\"",
    "export SDPATH",
    "",
    "# Source platform.sh for QNX compatibility shims (head, basename,",
    "# wc, printf, awk, sync, mkdir -p all shimmed for QNX)",
    "if [ -f \"${SDPATH}/scripts/common/platform.sh\" ]; then",
    "    . \"${SDPATH}/scripts/common/platform.sh\"",
    "fi",
    "",
    "# Status screen: mmi_splash on MMI 3G+ units (live steps, then DONE or",
    "# FAILED); showScreen with the PNGs elsewhere, or if mmi_splash does not start.",
    "TMPD=/tmp; [ -d /fs/tmpfs ] && TMPD=/fs/tmpfs",
    "FORGE_DONE=\"${TMPD}/forge_done\"",
    "FORGE_PROGRESS=\"${TMPD}/forge_progress\"",
    "FORGE_NOTE=\"${TMPD}/forge_note\"",
    "export FORGE_PROGRESS FORGE_NOTE",
    "rm -f \"${FORGE_DONE}\" \"${FORGE_PROGRESS}\" \"${FORGE_NOTE}\"",
    "SPLASH_PID=\"\"",
    "SHOWSCREEN_PID=\"\"",
    "RUN_FAILED=0",
    "RUN_DONE=0",
    "if [ -f /etc/pci-3g_9411.cfg ] && [ -f \"${SDPATH}/bin/mmi_splash\" ] && [ -f \"${SDPATH}/lib/running.bin\" ]; then",
    "    cp \"${SDPATH}/bin/mmi_splash\" \"${TMPD}/mmi_splash\" 2>/dev/null && chmod +x \"${TMPD}/mmi_splash\" 2>/dev/null",
    "    \"${TMPD}/mmi_splash\" \"${SDPATH}/lib/running.bin\" \"${SDPATH}/lib/done.bin\" \"${FORGE_DONE}\" 3600 8 \"${SDPATH}/lib/failed.bin\" > \"${TMPD}/mmi_splash.log\" 2>&1 &",
    "    SPLASH_PID=$!",
    "    sleep 2",
    "    kill -0 ${SPLASH_PID} 2>/dev/null || SPLASH_PID=\"\"",
    "fi",
    "if [ -z \"${SPLASH_PID}\" ] && [ -f \"${SDPATH}/bin/showScreen\" ] && [ -f \"${SDPATH}/lib/running.png\" ]; then",
    "    cp \"${SDPATH}/bin/showScreen\" /tmp/showScreen 2>/dev/null",
    "    chmod +x /tmp/showScreen 2>/dev/null",
    "    /tmp/showScreen \"${SDPATH}/lib/running.png\" &",
    "    SHOWSCREEN_PID=$!",
    "fi",
    "",
    "# progress <line>: the status screen's step line (\"a-b/n label\" or \"label\")",
    "progress() {",
    "    echo \"$*\" > \"${FORGE_PROGRESS}\" 2>/dev/null",
    "}",
    "",
    "# At exit: DONE, or FAILED if a module reported a failure or run.sh stopped early.",
    "finish() {",
    "    [ \"${RUN_DONE}\" = 1 ] || RUN_FAILED=1",
    "    if [ \"${RUN_FAILED}\" = 0 ]; then",
    "        : > \"${FORGE_DONE}\"",
    "    else",
    "        echo FAIL > \"${FORGE_DONE}\"",
    "        echo \"[FAIL] the card did not finish cleanly; see the lines above\"",
    "    fi",
    "    if [ -n \"${SPLASH_PID}\" ]; then",
    "        wait ${SPLASH_PID} 2>/dev/null",
    "        cp \"${TMPD}/mmi_splash.log\" \"${SDPATH}/var/\" 2>/dev/null",
    "    elif [ -n \"${SHOWSCREEN_PID}\" ]; then",
    "        kill ${SHOWSCREEN_PID} 2>/dev/null",
    "        sleep 1",
    "        SCREEN=done",
    "        [ \"${RUN_FAILED}\" = 0 ] || SCREEN=failed",
    "        [ -f \"${SDPATH}/lib/${SCREEN}.png\" ] || SCREEN=done",
    "        /tmp/showScreen \"${SDPATH}/lib/${SCREEN}.png\" &",
    "    fi",
    "}",
    "trap finish 0",
    "",
    "mkdir -p \"${SDPATH}/var\" 2>/dev/null",
    "LOGFILE=\"${SDPATH}/var/install-$(date +%Y%m%d-%H%M%S).log\"",
    "EFSDIR=\"/mnt/efs-system\"",
    "ENGDEFS=\"${EFSDIR}/engdefs\"",
    "",
    "exec > ${LOGFILE} 2>&1",
    "",
    "echo \"============================================\"",
    "echo \" MMI3G-Toolkit Installer\"",
    "echo \" $(date)\"",
    "echo \" Train: $(cat /dev/shmem/sw_trainname.txt 2>/dev/null)\"",
    "echo \"============================================\"",
    "echo \"\"",
    "",
  ];

  if (needsFlashInstall) {
    lines.push(
      "# Safety checks",
      "if [ ! -d \"${EFSDIR}\" ]; then",
      "    echo \"[ERROR] /mnt/efs-system not found!\"",
      "    exit 1",
      "fi",
      "",
      "# Create engdefs if needed (gem-activator will populate it)",
      "mkdir -p \"${ENGDEFS}\" 2>/dev/null",
      "",
      "# Remount read-write",
      "mount -uw ${EFSDIR} 2>/dev/null",
      "if [ $? -ne 0 ]; then",
      "    echo \"[ERROR] Failed to remount efs-system\"",
      "    exit 1",
      "fi",
      "echo \"[OK] efs-system remounted rw\"",
      "echo \"\"",
      "",
      "# Install shared platform.sh helper (sourced by module scripts)",
      "if [ -f \"${SDPATH}/scripts/common/platform.sh\" ]; then",
      "    mkdir -p \"${EFSDIR}/scripts/common\"",
      "    cp -v \"${SDPATH}/scripts/common/platform.sh\" \"${EFSDIR}/scripts/common/platform.sh\"",
      "    chmod 0644 \"${EFSDIR}/scripts/common/platform.sh\"",
      "    echo \"[OK] platform.sh installed to ${EFSDIR}/scripts/common/\"",
      "fi",
      "echo \"\"",
      "",
    );
  } else {
    lines.push(
      "# Selected modules are SD-only; do not remount or write efs-system.",
      "echo \"[INFO] SD-only module set; efs-system will not be remounted\"",
      "echo \"\"",
      "",
    );
  }

  const modCount = selected.length;
  for (const [modIndex, modName] of selected.entries()) {
    const meta = manifest.modules[modName];
    if (!meta) continue;
    const installsToFlash = meta.installs_to_flash !== false;
    const scriptDir = meta.script_dir || `/scripts/${modName}`;
    const esdFiles = (meta.files || [])
      .filter(f => f.path.startsWith("engdefs/") && f.path.endsWith(".esd"))
      .sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
    const shFiles = (meta.files || [])
      .filter(f => f.path.startsWith("scripts/") && f.path.endsWith(".sh"))
      .sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));

    lines.push(`# --- Module: ${modName} ---`);
    // The status screen's bar creeps through this module's share.
    lines.push(`FORGE_MOD_RANGE="${modIndex}-${modIndex + 1}/${modCount}"`);
    lines.push("export FORGE_MOD_RANGE");
    lines.push(`progress "\${FORGE_MOD_RANGE} ${modName}"`);
    lines.push(`echo "[MODULE] Installing ${modName}..."`);
    lines.push(`MOD_FAILED_BEFORE=\${RUN_FAILED}`);
    if (installsToFlash) {
      // Re-mount EFS rw (standalone modules may trigger F3S reclaim)
      lines.push('mount -uw ${EFSDIR} 2>/dev/null');
    } else {
      lines.push("# SD-only module: run from card and skip flash install");
    }
    if (meta.standalone && meta.run_script) {
      const runScript = overrides[modName] || meta.run_script;
      lines.push(`if [ -f "\${SDPATH}/scripts/${runScript}" ]; then`);
      lines.push(`    ksh "\${SDPATH}/scripts/${runScript}" "\${SDPATH}"`);
      lines.push("    MOD_RC=$?");
      lines.push("    if [ ${MOD_RC} -eq 0 ]; then");
      lines.push(`        echo "[OK] ${modName} standalone script executed"`);
      if (meta.exit_code_reports_failure) {
        lines.push("    else");
        lines.push(`        echo "[FAIL] ${modName} reported a failure (exit \${MOD_RC})"`);
        lines.push("        RUN_FAILED=1");
      } else {
        lines.push("    else");
        lines.push(`        echo "[WARN] ${modName} script exited \${MOD_RC}"`);
      }
      lines.push("    fi");
      lines.push("else");
      lines.push(`    echo "[WARN] ${runScript} not found for ${modName}"`);
      lines.push("fi");

      if (installsToFlash && shFiles.length > 0) {
        lines.push(`SCRIPTDIR="\${EFSDIR}${scriptDir}"`);
        lines.push("mkdir -p ${SCRIPTDIR}");
        for (const f of shFiles) {
          const name = f.path.split("/").pop();
          lines.push(`if [ -f "\${SDPATH}/scripts/${name}" ]; then`);
          lines.push(`    cp -v "\${SDPATH}/scripts/${name}" "\${SCRIPTDIR}/${name}"`);
          lines.push(`    chmod +x "\${SCRIPTDIR}/${name}"`);
          lines.push("fi");
        }
      }
    } else if (installsToFlash) {
      lines.push(`if [ -d "\${SDPATH}/engdefs" ]; then`);
      for (const f of esdFiles) {
        const name = f.path.split("/").pop();
        lines.push(`    if [ -f "\${SDPATH}/engdefs/${name}" ]; then`);
        lines.push(`        cp -v "\${SDPATH}/engdefs/${name}" "\${ENGDEFS}/${name}"`);
        lines.push(`        echo "[INST] ${name}"`);
        lines.push(`    fi`);
      }
      lines.push(`fi`);
      if (shFiles.length > 0) {
        lines.push(`SCRIPTDIR="\${EFSDIR}${scriptDir}"`);
        lines.push(`mkdir -p \${SCRIPTDIR}`);
        lines.push(`if [ -d "\${SDPATH}/scripts" ]; then`);
        for (const f of shFiles) {
          const name = f.path.split("/").pop();
          lines.push(`    if [ -f "\${SDPATH}/scripts/${name}" ]; then`);
          lines.push(`        cp -v "\${SDPATH}/scripts/${name}" "\${SCRIPTDIR}/${name}"`);
          lines.push(`        chmod +x "\${SCRIPTDIR}/${name}"`);
          lines.push(`        echo "[INST] ${name}"`);
          lines.push(`    fi`);
        }
        lines.push(`fi`);
      }
    } else {
      lines.push(`echo "[INFO] ${modName} is SD-only; no flash files installed"`);
    }

    lines.push(`if [ "\${RUN_FAILED}" = "\${MOD_FAILED_BEFORE}" ]; then echo "[OK] ${modName} installed"; else echo "[FAIL] ${modName} did not install"; fi`);
    lines.push(`echo ""`);
    lines.push("");
  }

  lines.push("# --- Complete ---");
  lines.push(`progress "${selected.length}/${selected.length} finishing"`);
  lines.push("echo \"============================================\"");
  lines.push("if [ \"${RUN_FAILED}\" = 0 ]; then");
  lines.push("    echo \" Installation Complete\"");
  lines.push("else");
  lines.push("    echo \" Installation FAILED: see the [FAIL] lines above\"");
  lines.push("fi");
  lines.push(`echo " Modules installed: ${selected.length}"`);
  lines.push("echo \" Log: ${LOGFILE}\"");
  lines.push("echo \"\"");
  lines.push("echo \" Open GEM (CAR + BACK) to access new screens\"");
  lines.push("echo \"============================================\"");
  lines.push("");
  lines.push("# The status screen shows DONE or FAILED from finish() at exit.");
  lines.push("RUN_DONE=1");

  return lines.join("\n") + "\n";
}

/**
 * Fetch every file required by the selected modules plus core files.
 * Returns an array of { path, bytes } ready to be written either to a
 * directory picker or to a ZIP.
 */
// toolkit-card.txt: which build made this card, so its logs can be matched to
// it later (builder/build_sd.py writes the same keys).
function cardStamp(selected, manifest) {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const built = d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) + " " +
    p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + " UTC";
  return ["MMI3G-Toolkit card",
    "built: " + built,
    "builder: web (manifest " + (manifest.generated || "?") + ", " + (manifest.branch || "?") + ")",
    "modules: " + Array.from(selected).join(" "),
    ""].join("\n");
}

async function buildSdBundle(selected, onProgress, overrides, wifiFiles) {
  overrides = overrides || {};
  onProgress && onProgress("Loading manifest...", 0);
  const manifest = await fetchJson(MANIFEST_URL + "?t=" + Date.now());  // cache-bust: always fresh
  const rawBase = manifest.raw_url_base;
  const moduleOutputPath = (modName, meta, f) => {
    if (f.path === "module.json") return null;
    if (f.path.startsWith("engdefs/") || f.path.startsWith("scripts/")) return f.path;
    if (meta.artifact && f.path === meta.artifact) return `modules/${modName}/${f.path}`;
    for (const payload of (meta.payload_dirs || [])) {
      const source = String(payload.source || "").replace(/\/+$/, "");
      const target = String(payload.target || source).replace(/\/+$/, "");
      if (source && target && f.path.startsWith(`${source}/`)) {
        return `${target}/${f.path.slice(source.length + 1)}`;
      }
    }
    return null;
  };

  // Count total fetches for progress
  let totalFiles = 2; // copie_scr_plain.sh + uninstall.sh
  if (manifest.core_files.platform_sh) totalFiles += 1;
  if (manifest.core_files.showScreen) totalFiles += 1;
  if (manifest.core_files.mmi_splash) totalFiles += 1;
  for (const pngKey of ["lib_running_png", "lib_done_png", "lib_failed_png",
                        "lib_running_bin", "lib_done_bin", "lib_failed_bin"]) {
    if (manifest.core_files[pngKey]) totalFiles += 1;
  }
  if (selected.includes("gem-activator")) {
    for (const pngKey of ["lib_gem_enabled_png", "lib_gem_disabled_png"]) {
      if (manifest.core_files[pngKey]) totalFiles += 1;
    }
  }
  for (const mod of selected) {
    const meta = manifest.modules[mod];
    if (!meta) continue;
    totalFiles += (meta.files || []).filter((f) => moduleOutputPath(mod, meta, f)).length;
    if (meta.release_zip) totalFiles += 1;
  }
  let done = 0;
  const step = (label) => {
    done += 1;
    onProgress && onProgress(label, Math.min(99, Math.round(done * 95 / totalFiles)));
  };

  // --- Core files ---
  onProgress && onProgress("Fetching copie_scr.sh template...", 2);
  const plainCopie = await fetchBinary(rawBase + manifest.core_files.copie_scr_plain_sh);
  step("Encoding copie_scr.sh");
  const encodedCopie = new MMI3GCipher().process(plainCopie);

  const uninstallSh = await fetchBinary(rawBase + manifest.core_files.uninstall_sh);
  step("Fetched uninstall.sh");

  let platformSh = null;
  if (manifest.core_files.platform_sh) {
    try {
      platformSh = await fetchBinary(rawBase + manifest.core_files.platform_sh);
      step("Fetched platform.sh");
    } catch (e) {
      console.warn("platform.sh not available:", e);
    }
  }

  // Fetch showScreen binary (proven SH4 QNX tool for displaying PNGs on MMI)
  let showScreenBin = null;
  if (manifest.core_files.showScreen) {
    try {
      showScreenBin = await fetchBinary(rawBase + manifest.core_files.showScreen);
      step("Fetched showScreen");
    } catch (e) {
      console.warn("showScreen not available:", e);
    }
  }

  // --- Module files (parallel fetches per module) ---
  const files = [];
  files.push({ path: "copie_scr.sh", bytes: encodedCopie });
  files.push({ path: "uninstall.sh", bytes: uninstallSh });
  files.push({ path: "toolkit-card.txt", bytes: new TextEncoder().encode(cardStamp(selected, manifest)) });
  if (platformSh) {
    files.push({ path: "scripts/common/platform.sh", bytes: platformSh });
  }

  // Track paths provided by gemmi_assets to skip payload duplicates
  const gemmiAssetPaths = new Set();
  if (manifest.gemmi_assets && selected.includes("google-earth")) {
    for (const a of manifest.gemmi_assets.files) gemmiAssetPaths.add(a.path);
  }

  for (const modName of selected) {
    const meta = manifest.modules[modName];
    if (!meta) continue;
    const bundleFiles = (meta.files || []).filter((f) => {
      const outPath = moduleOutputPath(modName, meta, f);
      if (!outPath) return false;
      if (gemmiAssetPaths.has(outPath)) return false; // skip — provided by gemmi_assets
      return true;
    });
    const tasks = bundleFiles.map(async (f) => {
      const url = rawBase + `modules/${modName}/${f.path}`;
      const bytes = await fetchBinary(url);
      step(`Fetched ${modName}/${f.path}`);
      return { path: moduleOutputPath(modName, meta, f), bytes };
    });
    const results = await Promise.all(tasks);
    for (const r of results) if (r) files.push(r);

    // --- Release assets: fetch individual binaries from GitHub Release ---
    const ra = meta.release_assets;
    if (ra && ra.files && ra.files.length > 0) {
      onProgress && onProgress(`Downloading ${modName} binaries (${ra.files.length} files)...`, Math.round(done * 95 / totalFiles));
      for (const asset of ra.files) {
        try {
          const url = ra.base_url + asset.name;
          const bytes = await fetchBinary(url);
          files.push({ path: asset.path, bytes });
          step(`Fetched ${asset.name}`);
        } catch (e) {
          console.warn(`Skip asset ${asset.name}: ${e.message}`);
        }
      }
    }

    const rz = meta.release_zip;
    if (rz) {
      onProgress && onProgress(`Downloading ${modName} payload ZIP...`, Math.round(done * 95 / totalFiles));
      const zipFiles = await fetchReleaseZipFiles(rz);
      files.push(...zipFiles);
      step(`Extracted ${modName} payload ZIP (${zipFiles.length} files)`);
    }
  }

  // --- Generated run.sh ---
  onProgress && onProgress("Generating run.sh...", 97);
  const runSh = generateRunSh(selected, manifest, overrides);
  files.push({ path: "run.sh", bytes: new TextEncoder().encode(runSh) });

  // --- Placeholder dirs so bin/ lib/ var/ exist even if empty ---
  if (showScreenBin) {
    files.push({ path: "bin/showScreen", bytes: showScreenBin });
  }
  // The status screen: mmi_splash and its RUNNING/DONE/FAILED images (MMI 3G+),
  // with showScreen and the PNGs as the fallback. Always included.
  const statusAssets = [
    ['mmi_splash', 'bin/mmi_splash'],
    ['lib_running_png', 'lib/running.png'],
    ['lib_done_png', 'lib/done.png'],
    ['lib_failed_png', 'lib/failed.png'],
    ['lib_running_bin', 'lib/running.bin'],
    ['lib_done_bin', 'lib/done.bin'],
    ['lib_failed_bin', 'lib/failed.bin'],
  ];
  for (const [key, outPath] of statusAssets) {
    if (manifest.core_files[key]) {
      try {
        const bytes = await fetchBinary(rawBase + manifest.core_files[key]);
        files.push({ path: outPath, bytes });
        step(`Fetched ${outPath}`);
      } catch (e) { console.warn(`${key} not available:`, e); }
    }
  }
  // Module-specific PNGs — only when that module is selected
  if (selected.includes("gem-activator")) {
    for (const pngKey of ['lib_gem_enabled_png', 'lib_gem_disabled_png']) {
      if (manifest.core_files[pngKey]) {
        try {
          const png = await fetchBinary(rawBase + manifest.core_files[pngKey]);
          const fname = pngKey.replace('lib_', '').replace('_png', '.png');
          files.push({ path: `lib/${fname}`, bytes: png });
          step(`Fetched ${fname}`);
        } catch (e) { console.warn(`${pngKey} not available:`, e); }
      }
    }
  }
  files.push({ path: "bin/.keep", bytes: new Uint8Array(0) });
  files.push({ path: "lib/.keep", bytes: new Uint8Array(0) });
  files.push({ path: "var/.keep", bytes: new Uint8Array(0) });

  // --- GEMMI binaries (only when google-earth module is selected) ---
  // P0824 deploy already bundles a /gemmi payload, so avoid overwriting it.
  if (selected.includes("google-earth") && !selected.includes("google-earth-p0824-deploy") && manifest.gemmi_assets) {
    const ga = manifest.gemmi_assets;
    onProgress && onProgress("Fetching GEMMI binaries (~25MB)...", 96);
    for (const asset of ga.files) {
      try {
        const url = asset.url || (ga.base_url + asset.name);
        let bytes = await fetchBinary(url);
        files.push({ path: asset.path, bytes });
        step(`Fetched ${asset.name} (${(bytes.length / 1024 / 1024).toFixed(1)}MB)`);
      } catch (e) {
        console.warn(`GEMMI asset ${asset.name} not available:`, e);
        // Don't fail the build — ge_deploy.sh handles missing files gracefully
      }
    }
  }

  // --- wifi-sta settings made in this page (only when wifi-sta is selected) ---
  // hotspot.conf holds derived keys only (null: keep the car's networks);
  // options sets the start-up choice and the inbound list.
  if (selected.includes("wifi-sta") && wifiFiles) {
    if (wifiFiles.hotspotConf) {
      files.push({ path: "wifi-sta/hotspot.conf", bytes: new TextEncoder().encode(wifiFiles.hotspotConf) });
    }
    if (wifiFiles.options) {
      files.push({ path: "wifi-sta/options", bytes: new TextEncoder().encode(wifiFiles.options) });
    }
  }

  // Deduplicate: later entries (release_zip) override earlier ones (manifest)
  const deduped = new Map();
  for (const f of files) deduped.set(f.path, f);
  const uniqueFiles = Array.from(deduped.values());

  onProgress && onProgress("Bundle ready", 100);
  return { files: uniqueFiles, manifest };
}

/**
 * Write the bundle directly to a user-chosen directory (Chrome/Edge).
 * Uses the File System Access API — same approach as PCM-Forge.
 */
// Entries the OS puts on any card: not a sign the card is in use.
const CARD_SYSTEM_ENTRIES = new Set(["System Volume Information", "$RECYCLE.BIN", ".Spotlight-V100",
  ".fseventsd", ".Trashes", ".TemporaryItems", ".DS_Store", "._.DS_Store", "desktop.ini"]);

// What is already in the chosen folder, apart from the OS's own entries.
async function cardContents(dirHandle) {
  const names = [];
  for await (const [name] of dirHandle.entries()) {
    if (!CARD_SYSTEM_ENTRIES.has(name)) names.push(name);
  }
  return names.sort();
}

// Read every written file back and compare its size with what was meant to be
// written. Returns the paths that are missing or the wrong size.
async function verifyBundleInDirectory(bundle, dirHandle) {
  const bad = [];
  for (const f of bundle.files) {
    if (f.path.endsWith("/.keep")) continue;
    const parts = f.path.split("/").filter(Boolean);
    if (parts.length === 0) continue;
    const fname = parts.pop();
    try {
      let dir = dirHandle;
      for (const part of parts) dir = await dir.getDirectoryHandle(part);
      const file = await (await dir.getFileHandle(fname)).getFile();
      const want = f.bytes.byteLength !== undefined ? f.bytes.byteLength : f.bytes.length;
      if (file.size !== want) bad.push(f.path);
    } catch (e) {
      bad.push(f.path);
    }
  }
  return bad;
}

async function writeBundleToDirectory(bundle, dirHandle) {
  async function ensureDir(parent, name) {
    return await parent.getDirectoryHandle(name, { create: true });
  }
  async function getNestedDir(root, relPath) {
    const parts = relPath.split("/").filter(Boolean);
    let h = root;
    for (const p of parts) h = await ensureDir(h, p);
    return h;
  }

  const writeErrors = [];
  for (const f of bundle.files) {
    if (f.path.endsWith("/.keep")) continue;
    const parts = f.path.split("/").filter(Boolean);
    if (parts.length === 0) continue;
    const fname = parts.pop();
    if (!fname || fname === '.' || fname === '..') continue;
    const parentRel = parts.join("/");
    try {
      const parentH = parentRel ? await getNestedDir(dirHandle, parentRel) : dirHandle;
      const fileH = await parentH.getFileHandle(fname, { create: true });
      const writable = await fileH.createWritable();
      await writable.write(f.bytes);
      await writable.close();
    } catch (e) {
      writeErrors.push(f.path);
      console.warn(`Skip: ${f.path} (${e.message})`);
    }
  }
  if (writeErrors.length > 0) {
    console.warn(`Failed to write ${writeErrors.length} files:`, writeErrors);
    // verifyBundleInDirectory() reports these to the user after the write.
  }
}

/**
 * Package the bundle as a ZIP file and trigger a download.
 */
async function downloadBundleAsZip(bundle, filename) {
  const zip = new JSZip();
  for (const f of bundle.files) {
    if (f.path.endsWith("/.keep")) continue; // directories get created automatically when child files added; .keep not needed
    zip.file(f.path, f.bytes);
  }
  const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ============================================================
// Wi-Fi client (wifi-sta) settings. Checked and rendered here, in the
// browser: the passphrases never leave the page. wifiPsk() turns each one
// into the WPA2 key and only the key goes on the card, in the same
// hotspot.conf format as make_hotspot_conf.py writes.
// ============================================================

// A network name: 1-32 bytes of UTF-8, no double quote (it ends ssid="...").
function wifiSsidProblem(ssid) {
  const s = String(ssid == null ? "" : ssid);
  if (s.length === 0) return "Enter the network name";
  if (new TextEncoder().encode(s).length > 32) return "The name is longer than 32 bytes";
  if (s.indexOf('"') !== -1) return "The name cannot contain a double quote";
  if (/[\u0000-\u001f\u007f]/.test(s)) return "The name cannot contain control characters";
  return null;
}

// A WPA2 passphrase: 8-63 printable ASCII characters (0x20-0x7e).
function wifiPassphraseProblem(pass) {
  const p = String(pass == null ? "" : pass);
  if (p.length === 0) return "Enter the passphrase";
  for (let i = 0; i < p.length; i++) {
    const c = p.charCodeAt(i);
    if (c < 0x20 || c > 0x7e) return "Use plain ASCII letters, digits and symbols only";
  }
  if (p.length < 8 || p.length > 63) return "A WPA2 passphrase is 8 to 63 characters";
  return null;
}

// The key wpa_passphrase prints: PBKDF2-HMAC-SHA1(passphrase, ssid, 4096
// rounds, 32 bytes) as 64 lowercase hex digits.
async function wifiPsk(ssid, passphrase) {
  const problem = wifiSsidProblem(ssid) || wifiPassphraseProblem(passphrase);
  if (problem) throw new Error(problem);
  if (typeof crypto === "undefined" || !crypto.subtle) {
    throw new Error("This browser cannot make the Wi-Fi keys here (the page needs HTTPS)");
  }
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-1", salt: enc.encode(ssid), iterations: 4096 }, key, 256);
  return Array.from(new Uint8Array(bits), (b) => b.toString(16).padStart(2, "0")).join("");
}

// hotspot.conf from [{ ssid, psk }], first = preferred. The same blocks as
// make_hotspot_conf.py: priority= lines only when there is more than one.
function renderHotspotConf(networks) {
  if (!Array.isArray(networks) || networks.length < 1 || networks.length > 4) {
    throw new Error("hotspot.conf takes 1 to 4 networks");
  }
  let out = "# Made by the MMI3G-Toolkit web builder (keys derived as wpa_passphrase does).\n";
  networks.forEach((n, i) => {
    const problem = wifiSsidProblem(n.ssid);
    if (problem) throw new Error(problem);
    if (typeof n.psk !== "string" || n.psk.length !== 64 || !/^[0-9a-f]+$/.test(n.psk)) {
      throw new Error("each network needs a 64-digit hex key");
    }
    out += "network={\n\tssid=\"" + n.ssid + "\"\n\tkey_mgmt=WPA-PSK\n\tpsk=" + n.psk + "\n";
    if (networks.length > 1) out += "\tpriority=" + (networks.length - i) + "\n";
    out += "}\n";
  });
  return out;
}

// "tcp 2021, udp 5353" -> ["tcp 2021", "udp 5353"]. Commas, semicolons or
// new lines separate entries; ports 1-65535 without leading zeros.
function parseExtraPorts(text) {
  const entries = [];
  const problems = [];
  for (const raw of String(text == null ? "" : text).split(/[,;\n]/)) {
    const item = raw.trim().toLowerCase().replace(/\s+/g, " ");
    if (!item) continue;
    const m = /^(tcp|udp) ([1-9][0-9]*)$/.exec(item);
    if (!m || Number(m[2]) > 65535) {
      problems.push("\"" + raw.trim() + "\" is not tcp or udp and a port from 1 to 65535");
      continue;
    }
    const entry = m[1] + " " + m[2];
    if (entries.indexOf(entry) === -1) entries.push(entry);
  }
  return { entries: entries, problems: problems };
}

// The inbound entries the switches and the extra ports make, without repeats.
function wifiAllowLines(opts) {
  const o = opts || {};
  const parsed = parseExtraPorts(o.extraPorts);
  const allow = [];
  const add = (entry) => { if (allow.indexOf(entry) === -1) allow.push(entry); };
  if (o.ping !== false) add("icmp");
  if (o.telnet === true) add("tcp 23");
  parsed.entries.forEach(add);
  return { allow: allow, problems: parsed.problems };
}

// wifi-sta/options, as read_options() in wifi_sta_run.sh reads it.
function renderWifiOptions(opts) {
  const o = opts || {};
  const lines = wifiAllowLines(o);
  if (lines.problems.length) throw new Error("extra ports: " + lines.problems[0]);
  if (lines.allow.length > 16) throw new Error("at most 16 allow lines");
  const out = ["# wifi-sta options (made by the web builder)",
    "start-up=" + (o.joinAtStartup === false ? "ap" : "client")];
  if (lines.allow.length === 0) out.push("allow=none");
  for (const entry of lines.allow) out.push("allow=" + entry);
  return out.join("\n") + "\n";
}

// What the Wi-Fi form still needs, per row and for the card panel.
function wifiFormState(wifi) {
  const rows = wifi.nets.map((n) => ({ ssid: wifiSsidProblem(n.ssid), pass: wifiPassphraseProblem(n.pass) }));
  wifi.nets.forEach((n, i) => {
    if (!rows[i].ssid && wifi.nets.slice(0, i).some((o) => o.ssid === n.ssid)) {
      rows[i].ssid = "This network is already in the list";
    }
  });
  const lines = wifiAllowLines({ ping: wifi.ping, telnet: wifi.telnet, extraPorts: wifi.extra });
  const issues = [];
  if (!wifi.keep) {
    const filled = wifi.nets.filter((n) => n.ssid || n.pass);
    if (filled.length === 0) {
      issues.push("Wi-Fi client needs its networks set");
    } else if (wifi.cleared && wifi.nets.every((n) => !n.pass) && rows.every((r) => !r.ssid)) {
      issues.push("Wi-Fi client: enter the passphrases again (they were cleared after the last build)");
    } else {
      rows.forEach((r, i) => {
        const p = r.ssid || r.pass;
        if (p) issues.push("Wi-Fi client, network " + (i + 1) + ": " + p.charAt(0).toLowerCase() + p.slice(1));
      });
    }
  }
  lines.problems.forEach((p) => issues.push("Wi-Fi client, extra ports: " + p));
  if (lines.allow.length > 16) issues.push("Wi-Fi client: at most 16 entries can be allowed, this has " + lines.allow.length);
  return { rows: rows, allow: lines.allow, extraProblems: lines.problems, issues: issues };
}

// ============================================================
// Card size estimate: the manifest's file sizes for what the build bundles
// (as buildSdBundle picks them), plus the status screen files.
// ============================================================

function estimateCardBytes(selected, manifest) {
  let total = STATUS_SCREEN_BYTES;
  for (const modName of selected) {
    const meta = manifest.modules[modName];
    if (!meta) continue;
    for (const f of (meta.files || [])) {
      if (f.path === "module.json") continue;
      const inPayload = (meta.payload_dirs || []).some((p) => {
        const source = String(p.source || "").replace(/\/+$/, "");
        return source && f.path.startsWith(source + "/");
      });
      if (f.path.startsWith("engdefs/") || f.path.startsWith("scripts/") ||
          (meta.artifact && f.path === meta.artifact) || inPayload) {
        total += f.size || 0;
      }
    }
    if (meta.release_zip && meta.release_zip.size) total += meta.release_zip.size;
    const ra = meta.release_assets;
    if (ra && ra.files) for (const a of ra.files) total += a.size || 0;
  }
  if (selected.includes("google-earth") && !selected.includes("google-earth-p0824-deploy") && manifest.gemmi_assets) {
    for (const a of (manifest.gemmi_assets.files || [])) total += a.size || 0;
  }
  return total;
}

function formatMB(bytes) {
  return (bytes / 1e6).toFixed(bytes < 1e7 ? 1 : 0) + " MB";
}

// Catalog model: one card per module, except CATALOG_GROUPS.
// ============================================================

const MODULE_BY_ID = Object.fromEntries(MODULES_DISPLAY.map((m) => [m.id, m]));
const CATALOG_ITEMS = (() => {
  const items = [];
  const seen = new Set();
  for (const m of MODULES_DISPLAY) {
    const g = CATALOG_GROUPS.find((x) => x.members.includes(m.id));
    if (g) {
      if (!seen.has(g.key)) { seen.add(g.key); items.push({ key: g.key, group: g }); }
    } else {
      items.push({ key: m.id, module: m });
    }
  }
  return items;
})();
const ITEMS_WITH_SETTINGS = new Set(["ge", "research", "wifi-sta"]);

function withPrereqs(s) {
  MODULES_DISPLAY.forEach(m => { if (s.has(m.id) && m.prereq && !s.has(m.prereq)) s.add(m.prereq); });
  return s;
}

  const [showIssues, setShowIssues] = useState(false);
  const [manifest, setManifest] = useState(null);
  const [manifestFailed, setManifestFailed] = useState(false);
  const [buildState, setBuildState] = useState("idle"); // idle | building | done-zip | done-sd | error
  const [buildProgress, setBuildProgress] = useState({ label: "", pct: 0 });
  const [buildError, setBuildError] = useState(null);
  const [buildStats, setBuildStats] = useState(null);
  const [builtWifi, setBuiltWifi] = useState(null);
  const [sourceImg, setSourceImg] = useState(null);
  const [processedUrl, setProcessedUrl] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [panX, setPanX] = useState(0);
  const [panY, setPanY] = useState(0);
  const [exported, setExported] = useState(false);
  const canvasRef = useRef(null);
  const fileRef = useRef(null);
  const panelRef = useRef(null);
  const issuesRef = useRef(null);

  // The manifest gives the size estimate; the build fetches its own fresh copy.
  useEffect(() => {
    let live = true;
    fetchJson(MANIFEST_URL).then((m) => { if (live) setManifest(m); }).catch(() => { if (live) setManifestFailed(true); });
    return () => { live = false; };
  }, []);

  const processImage = useCallback(() => {
    if (!sourceImg) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.width = MMI_W; canvas.height = MMI_H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, MMI_W, MMI_H);
    const imgA = sourceImg.width / sourceImg.height;
    const mmiA = MMI_W / MMI_H;
    let dw, dh;
    if (imgA > mmiA) { dh = MMI_H * zoom; dw = dh * imgA; }
    else { dw = MMI_W * zoom; dh = dw / imgA; }
    ctx.drawImage(sourceImg, (MMI_W - dw) / 2 + panX, (MMI_H - dh) / 2 + panY, dw, dh);
    setProcessedUrl(canvas.toDataURL("image/png"));
    setExported(false);
  }, [sourceImg, zoom, panX, panY]);

  useEffect(() => { processImage(); }, [processImage]);

  const handleFile = (f) => {
    if (!f || !f.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = (e) => {
      const img = new Image();
      img.onload = () => { setSourceImg(img); setZoom(1); setPanX(0); setPanY(0); };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  };

  // ---- catalog items and selection ----
  const modelInfo = MODELS.find((m) => m.id === model) || MODELS[0];
  const platforms = BRAND_PLATFORMS[modelInfo.brand] || COMPAT_ORDER;
  const groupChosen = (key, c) => {
    if (key === "ge") return geMembers(c.geMethod, c.geWrappers);
    if (key === "research") return CATALOG_GROUPS.find((g) => g.key === "research").members.filter((id) => c.researchPicks.includes(id));
    return [];
  };
  const ctx = { geMethod, geWrappers, researchPicks };
  const chosenOf = (item) => (item.group ? groupChosen(item.key, ctx) : [item.key]);
  const allOf = (item) => (item.group ? item.group.members : [item.key]);
  const isOn = (item) => allOf(item).some((id) => selected.has(id));
  // A selected group shows what is on the card; an unselected one, what its settings would add.
  const modsOf = (item) => {
    const ids = item.group && isOn(item) ? item.group.members.filter((id) => selected.has(id)) : chosenOf(item);
    return ids.map((id) => MODULE_BY_ID[id]).filter(Boolean);
  };
  const itemName = (item) => (item.group ? item.group.name : item.module.name);
  const itemDesc = (item) => (item.group ? item.group.desc : item.module.desc);
  const itemCat = (item) => (item.group ? item.group.category : (item.module.primary ? "start" : item.module.category));
  const itemStatus = (item) => {
    const mods = modsOf(item);
    const odd = mods.find((m) => !GREEN_STATUS.includes(m.status));
    return (odd || mods[0] || { status: "" }).status;
  };
  const itemCompat = (item) => COMPAT_ORDER.filter((c) => modsOf(item).some((m) => m.compat.includes(c)));
  const compatText = (list) => (list.length === COMPAT_ORDER.length ? "all" : list.join(", "));
  const fitsCar = (item) => itemCompat(item).some((c) => platforms.includes(c));
  const itemSub = (item) => {
    if (item.key === "ge") {
      const m = GE_METHODS.find((x) => x.value === geMethod);
      return m ? m.label : "";
    }
    if (item.key === "research") return modsOf(item).map((m) => m.name).join(", ");
    return "";
  };

  const toggleItem = (item) => {
    const s = new Set(selected);
    const on = isOn(item);
    if (on) allOf(item).forEach((id) => s.delete(id));
    else chosenOf(item).forEach((id) => s.add(id));
    setSelected(withPrereqs(s));
    if (!on && ITEMS_WITH_SETTINGS.has(item.key)) setOpenOpts((o) => new Set(o).add(item.key));
  };
  // A group's settings changed: swap its module ids if the card is on.
  const regroup = (key, c) => {
    const item = CATALOG_ITEMS.find((i) => i.key === key);
    if (!item || !isOn(item)) return;
    const s = new Set(selected);
    item.group.members.forEach((id) => s.delete(id));
    groupChosen(key, c).forEach((id) => s.add(id));
    setSelected(withPrereqs(s));
  };
  const changeGeMethod = (v) => { setGeMethod(v); regroup("ge", { ...ctx, geMethod: v }); };
  const changeGeWrappers = (v) => { setGeWrappers(v); regroup("ge", { ...ctx, geWrappers: v }); };
  const changeResearch = (v) => { setResearchPicks(v); regroup("research", { ...ctx, researchPicks: v }); };
  const flip = (setter, key) => setter((o) => { const n = new Set(o); if (n.has(key)) n.delete(key); else n.add(key); return n; });

  // ---- what the card still needs ----
  const wifiForm = wifiFormState(wifi);
  const issues = [];
  if (selected.has("wifi-sta")) wifiForm.issues.forEach((t) => issues.push({ key: "wifi-sta", text: t }));
  const panelItems = CATALOG_ITEMS.filter(isOn);
  const estimate = manifest ? estimateCardBytes([...selected], manifest) : null;
  const sizeText = estimate != null ? "about " + formatMB(estimate) : (manifestFailed ? "size unknown" : "working out the size");

  // Build bundle into memory. Used by both "Write to a folder" and the ZIP.
  const buildInMemory = async (wifiFiles) => {
    // Check for modules that can't be web-built (CORS-blocked release assets)
    const blocked = [...selected].filter(m => MODULES_DISPLAY.find(d => d.id === m && d.cliOnly));
    if (blocked.length > 0) {
      const mod = MODULES_DISPLAY.find(d => d.id === blocked[0]);
      const payloadLine = mod.payloadUrl ? `\n\nPayload ZIP:\n  ${mod.payloadUrl}` : "";
      const message =
        `"${mod.name}" requires a payload ZIP hosted on GitHub Releases which browsers cannot download (CORS).\n\n` +
        `Use the CLI builder instead:\n  python builder/build_sd.py -m ${blocked[0]} -o F:\\\n\n` +
        `Or download the payload ZIP separately and build from the CLI.${payloadLine}`;
      setBuildError(message);
      setBuildState("error");
      const err = new Error(message);
      err.userFacing = true;
      throw err;
    }
    setBuildState("building");
    setBuildError(null);
    setBuildStats(null);
    setBuildProgress({ label: "Starting...", pct: 0 });
    try {
      const bundle = await buildSdBundle([...selected], (label, pct) => {
        setBuildProgress({ label, pct });
      }, { "google-earth": geScript }, wifiFiles);
      const totalBytes = bundle.files.reduce((n, f) => n + f.bytes.length, 0);
      setBuildStats({ fileCount: bundle.files.filter(f => !f.path.endsWith("/.keep")).length, totalBytes });
      return bundle;
    } catch (e) {
      if (!e.userFacing) console.error(e);
      setBuildError(String(e.message || e));
      setBuildState("error");
      throw e;
    }
  };

  const runBuild = async (mode) => {
    if (buildState === "building") return;
    if (selected.size === 0 || issues.length > 0) {
      setShowIssues(true);
      if (issues.length) setOpenOpts((o) => { const n = new Set(o); issues.forEach((i) => n.add(i.key)); return n; });
      setTimeout(() => { if (issuesRef.current) issuesRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 0);
      return;
    }
    setShowIssues(false);
    let dirHandle = null;
    if (mode === "folder") {
      if (!window.showDirectoryPicker) {
        setBuildError("Writing to a folder needs Chrome or Edge. Use Build SD card for a ZIP instead.");
        setBuildState("error");
        return;
      }
      try {
        // Ask for the SD card FIRST so the user intent is captured before the build runs.
        // The id makes the picker reopen where the card was picked last time.
        dirHandle = await window.showDirectoryPicker({ id: "mmi3g-sd-card", mode: "readwrite" });
      } catch (e) {
        return; // the picker was cancelled
      }
      // An old card's files would mix with the new ones: say so before writing.
      let existing = [];
      try { existing = await cardContents(dirHandle); } catch (e) { existing = []; }
      if (existing.length > 0) {
        const oldCard = existing.includes("copie_scr.sh") || existing.includes("run.sh");
        const shown = existing.slice(0, 8).join(", ") + (existing.length > 8 ? ", and " + (existing.length - 8) + " more" : "");
        const ok = window.confirm(
          (oldCard
            ? "This looks like an older toolkit card (" + shown + "). Its files would mix with the new ones, and old modules could run again."
            : "The folder " + dirHandle.name + " isn't empty: " + shown + ".") +
          "\n\nBest: cancel, empty or reformat the card (FAT32), and write again.\nWrite anyway?");
        if (!ok) return;
      }
    }
    setBuiltWifi(null);
    try {
      let wifiFiles = null;
      let netCount = 0;
      if (selected.has("wifi-sta")) {
        setBuildState("building");
        setBuildError(null);
        setBuildProgress({ label: "Making the Wi-Fi keys...", pct: 0 });
        const nets = wifi.keep ? [] : wifi.nets;
        try {
          const keyed = [];
          for (const n of nets) keyed.push({ ssid: n.ssid, psk: await wifiPsk(n.ssid, n.pass) });
          wifiFiles = {
            hotspotConf: keyed.length ? renderHotspotConf(keyed) : null,
            options: renderWifiOptions({ joinAtStartup: wifi.join, ping: wifi.ping, telnet: wifi.telnet, extraPorts: wifi.extra }),
          };
          netCount = keyed.length;
        } finally {
          // The passphrases are not kept once the keys are made.
          if (nets.length) setWifi((w) => ({ ...w, cleared: true, nets: w.nets.map((n) => ({ ...n, pass: "" })) }));
        }
      }
      const bundle = await buildInMemory(wifiFiles);
      if (mode === "folder") {
        setBuildProgress({ label: "Writing to the card...", pct: 98 });
        await writeBundleToDirectory(bundle, dirHandle);
        setBuildProgress({ label: "Checking what was written...", pct: 99 });
        const bad = await verifyBundleInDirectory(bundle, dirHandle);
        if (bad.length > 0) {
          const err = new Error(bad.length + " file" + (bad.length === 1 ? "" : "s") + " did not come back as written: " +
            bad.slice(0, 6).join(", ") + (bad.length > 6 ? ", ..." : "") +
            ". The card may be full, locked or failing. Reformat it (FAT32) and write again, or use a different card.");
          err.userFacing = true;
          throw err;
        }
        setBuildProgress({ label: "Card written and checked", pct: 100 });
        setBuildState("done-sd");
      } else {
        setBuildProgress({ label: "Packaging ZIP...", pct: 99 });
        const fname = `MMI3G-Toolkit-${new Date().toISOString().slice(0,10)}.zip`;
        await downloadBundleAsZip(bundle, fname);
        setBuildProgress({ label: "ZIP downloaded", pct: 100 });
        setBuildState("done-zip");
      }
      setBuiltWifi(netCount > 0 ? { count: netCount, mode } : null);
    } catch (e) {
      if (!e.userFacing) console.error(e);
      setBuildError(String(e.message || e));
      setBuildState("error");
    }
  };

  const repoUrl = "https://github.com/dspl1236/MMI3G-Toolkit";
  const chromium = typeof window !== "undefined" && "showDirectoryPicker" in window;
  const cliCommand = "python builder/build_sd.py" + [...selected].map(id => " -m " + id).join("") + " -o F:\\";
  const pw = MMI_W * PREVIEW_SCALE;
  const ph = MMI_H * PREVIEW_SCALE;
  const building = buildState === "building";

  // ---- catalog ----
  const q = query.trim().toLowerCase();
  const matches = (item) => {
    if (!q) return true;
    const texts = [itemName(item), itemDesc(item)];
    if (item.group) item.group.members.forEach((id) => { texts.push(MODULE_BY_ID[id].name, MODULE_BY_ID[id].desc); });
    return texts.some((t) => String(t).toLowerCase().includes(q));
  };
  const sections = CAT_ORDER
    .map((cat) => ({ cat, items: CATALOG_ITEMS.filter((i) => itemCat(i) === cat && matches(i)) }))
    .filter((s) => s.items.length > 0);

  const renderCard = (item) => {
    const on = isOn(item);
    const isExp = expanded.has(item.key);
    const status = itemStatus(item);
    const fits = fitsCar(item);
    const mods = modsOf(item);
    return h("div", {
      key: item.key, role: "button", tabIndex: 0, "aria-pressed": on ? "true" : "false",
      className: "card" + (on ? " on" : "") + (fits ? "" : " offcar"),
      onClick: () => toggleItem(item),
      onKeyDown: (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleItem(item); } },
    },
      h("div", { className: "card-top" },
        h("span", { className: "card-name" }, itemName(item)),
        on && h("span", { className: "tick", "aria-hidden": "true" }, "\u2713")),
      h("div", { className: "card-desc" }, itemDesc(item)),
      h("div", { className: "card-foot" },
        h("span", { className: GREEN_STATUS.includes(status) ? "green" : "amber" },
          status + " \u00b7 " + compatText(itemCompat(item)) + (fits ? "" : " \u00b7 not for " + modelInfo.label)),
        h("button", { type: "button", className: "link dim", "aria-expanded": isExp ? "true" : "false",
          onClick: (e) => { e.stopPropagation(); flip(setExpanded, item.key); } }, isExp ? "Hide details" : "Details")),
      isExp && h("div", { className: "card-detail", onClick: (e) => e.stopPropagation() },
        item.group
          ? mods.map((m) => h("p", { key: m.id }, h("span", { style: { color: "var(--text)" } }, m.name + ": "), m.detail))
          : h("p", null, item.module.detail),
        mods.filter((m) => m.prereq).map((m) => h("p", { key: "pre-" + m.id, className: "small" },
          "Needs " + ((MODULE_BY_ID[m.prereq] || {}).name || m.prereq) + ", which is added for you.")),
        !item.group && item.module.payloadUrl && h("p", null,
          h("a", { href: item.module.payloadUrl, target: "_blank", rel: "noopener" }, "Download the payload ZIP"))
      )
    );
  };

  const optionsFor = (item) => {
    if (item.key === "ge") return h(GeOptions, { method: geMethod, setMethod: changeGeMethod, script: geScript, setScript: setGeScript,
      wrappers: geWrappers, setWrappers: changeGeWrappers, platforms, modelLabel: modelInfo.label });
    if (item.key === "research") return h(ResearchOptions, { picks: researchPicks, setPicks: changeResearch });
    if (item.key === "wifi-sta") return h(WifiOptions, { wifi, setWifi, form: wifiForm, showErrors: showIssues });
    return null;
  };

  const renderPanelItem = (item) => {
    const hasOpts = ITEMS_WITH_SETTINGS.has(item.key);
    const open = openOpts.has(item.key);
    const neededBy = item.group ? [] : MODULES_DISPLAY.filter((d) => d.prereq === item.key && selected.has(d.id)).map((d) => d.name);
    const sub = itemSub(item);
    const itemIssues = issues.filter((i) => i.key === item.key);
    return h("div", { key: item.key, className: "pitem" },
      h("div", { className: "pitem-row" },
        h("div", { className: "pitem-name" }, itemName(item),
          sub && h("div", { className: "pitem-sub" }, sub),
          neededBy.length > 0 && h("div", { className: "pitem-sub" }, "Needed by " + neededBy.join(", ")),
          !fitsCar(item) && h("div", { className: "pitem-sub amber" }, "Not listed for " + modelInfo.label)),
        hasOpts && h("button", { type: "button", className: "link" + (itemIssues.length ? "" : " dim"), "aria-expanded": open ? "true" : "false",
          onClick: () => flip(setOpenOpts, item.key) }, (open ? "\u25BE" : "\u25B8") + " Settings"),
        h("button", { type: "button", className: "x", title: "Remove", "aria-label": "Remove " + itemName(item),
          onClick: () => toggleItem(item) }, "\u00d7")),
      hasOpts && open && optionsFor(item)
    );
  };

  const steps = [
    buildState === "done-zip" ? "Extract the ZIP to the root of an empty FAT32 SDHC card (32 GB)" : "The card must be FAT32 SDHC (32 GB)",
    "Start the MMI and let it boot fully (3 minutes or more)",
    "Insert the card; the screen shows the progress, then done",
    "Remove the card and restart the MMI",
    "Open the GEM with CAR + BACK (C7)",
  ];

  const panel = h("aside", { className: "panel", ref: panelRef, "aria-label": "Your card" },
    h("div", { className: "caps" }, "Your card"),
    h("div", { className: "rule", style: { width: 28 } }),
    panelItems.length === 0
      ? h("div", { className: "muted small" }, "Nothing on the card yet. Pick modules from the list.")
      : h("div", { style: { borderTop: "1px solid var(--line)" } }, panelItems.map(renderPanelItem)),
    issues.map((i, n) => h("div", { key: "w" + n, className: "warn" }, "\u26A0 " + i.text)),
    h("div", { className: "muted small", style: { marginTop: 12 } },
      selected.size + " module" + (selected.size === 1 ? "" : "s") + " \u00b7 " + sizeText + " \u00b7 FAT32 card"),
    showIssues && (selected.size === 0 || issues.length > 0) && h("div", { className: "issues", ref: issuesRef, role: "alert" },
      selected.size === 0 ? "Pick at least one module from the list first." : "Before you build:",
      issues.length > 0 && h("ul", null, issues.map((i, n) => h("li", { key: n }, i.text)))),
    h("button", {
      type: "button", className: "btn" + (building ? " busy" : (selected.size === 0 || issues.length > 0) ? " wait" : ""),
      "aria-disabled": (building || selected.size === 0 || issues.length > 0) ? "true" : "false",
      onClick: () => runBuild(chromium ? "folder" : "zip"),
    }, building ? (buildProgress.label || "Building...") : (chromium ? "Write to SD card" : "Build SD card")),
    h("div", { className: "muted small", style: { marginTop: 8, textAlign: "center" } },
      chromium
        ? "Pick the empty FAT32 card in the next window. Every file is read back and checked."
        : "Downloads a ZIP: unzip it onto an empty FAT32 card. Writing straight to a card needs Chrome or Edge."),
    chromium && h("button", { type: "button", className: "btn2", disabled: building, onClick: () => runBuild("zip") }, "Download a ZIP instead"),
    h("div", { className: "muted small", style: { marginTop: 6, textAlign: "center" } }, "The card shows live progress on the MMI."),
    building && h("div", { style: { marginTop: 12 } },
      h("div", { className: "muted small mono" }, buildProgress.label + " \u00b7 " + buildProgress.pct + "%"),
      h("div", { className: "bar" }, h("div", { style: { width: buildProgress.pct + "%" } }))),
    buildState === "error" && h("div", { className: "failbox", role: "alert" }, buildError),
    (buildState === "done-sd" || buildState === "done-zip") && buildStats && h("div", { className: "result" },
      h("div", { className: "green", style: { fontWeight: 600 } }, buildState === "done-sd" ? "Card ready: written and checked" : "ZIP ready"),
      h("div", { className: "muted mono", style: { fontSize: 11, marginTop: 2 } }, buildStats.fileCount + " files \u00b7 " + formatMB(buildStats.totalBytes)),
      h("ol", null, steps.map((s, n) => h("li", { key: n }, s)))),
    builtWifi && h("div", { className: "note-a" },
      (builtWifi.mode === "folder" ? "The card now holds" : "This ZIP contains") + " the Wi-Fi keys for " + builtWifi.count +
      " network" + (builtWifi.count === 1 ? "" : "s") + ", which is enough to join " + (builtWifi.count === 1 ? "it" : "them") +
      ". The installer deletes hotspot.conf from the card, but deleted files can linger, so reformat the card afterwards." +
      (builtWifi.mode === "folder" ? "" : " Delete the ZIP once the card is made.") +
      " The passphrases were cleared from this page."),
    h("details", { className: "cli" },
      h("summary", null, "Build it from the command line instead"),
      h("pre", { className: "mono" }, cliCommand),
      h("button", { type: "button", className: "link", style: { marginTop: 6 }, onClick: () => { navigator.clipboard?.writeText(cliCommand); } }, "Copy the command"),
      selected.has("wifi-sta") && h("div", { style: { marginTop: 6 } }, "The command line does not write hotspot.conf or options; see the wifi-sta README."))
  );

  const catalog = h("main", { className: "catalog" },
    h("div", { className: "caps" }, "SD card builder"),
    h("div", { className: "rule" }),
    h("h1", { style: { fontSize: 22, fontWeight: 600 } }, "Build a card for your MMI"),
    h("p", { className: "muted", style: { fontSize: 13, margin: "4px 0 22px" } }, "Pick your car, choose modules, then write them to an empty FAT32 SD card (or download a ZIP)."),
    sections.length === 0
      ? h("div", { className: "empty" }, "No modules match \u201C" + query.trim() + "\u201D.")
      : sections.map((s) => h("section", { key: s.cat, className: "section", "aria-label": CAT_LABELS[s.cat] },
          h("div", { className: "caps" }, CAT_LABELS[s.cat]),
          h("div", { className: "rule", style: { width: 24, margin: "6px 0 10px" } }),
          h("div", { className: "grid" }, s.items.map(renderCard))))
  );

  const splash = h("div", { className: "splash" },
    h("div", null,
      h("div", { className: "caps", style: { marginBottom: 8 } }, "MMI preview (800 \u00d7 480 at " + Math.round(PREVIEW_SCALE * 100) + "%)"),
      h("div", { style: { width: pw, maxWidth: "100%", aspectRatio: MMI_W + " / " + MMI_H, background: "#000", borderRadius: 8, border: "1px solid var(--line2)", position: "relative", overflow: "hidden" } },
        processedUrl ? h("img", { src: processedUrl, alt: "Splash screen preview", style: { width: "100%", height: "100%", display: "block" } }) :
          h("div", { className: "muted mono", style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 } }, "No image loaded")
      ),
      sourceImg && h("div", { className: "box", style: { marginTop: 10, fontSize: 12 } },
        h("div", { style: { display: "grid", gridTemplateColumns: "auto minmax(0, 1fr) 48px", gap: "8px 10px", alignItems: "center" } },
          h("span", { className: "muted" }, "Zoom"),
          h("input", { type: "range", min: 0.5, max: 3, step: 0.01, value: zoom, "aria-label": "Zoom", onChange: (e) => setZoom(parseFloat(e.target.value)) }),
          h("span", { className: "mono small" }, zoom.toFixed(2) + "\u00d7"),
          h("span", { className: "muted" }, "X"),
          h("input", { type: "range", min: -300, max: 300, step: 1, value: panX, "aria-label": "Move left or right", onChange: (e) => setPanX(parseInt(e.target.value)) }),
          h("span", { className: "mono small" }, panX),
          h("span", { className: "muted" }, "Y"),
          h("input", { type: "range", min: -200, max: 200, step: 1, value: panY, "aria-label": "Move up or down", onChange: (e) => setPanY(parseInt(e.target.value)) }),
          h("span", { className: "mono small" }, panY)
        ),
        h("button", { type: "button", className: "btn2", style: { width: "auto", display: "inline-block", padding: "4px 10px" }, onClick: () => { setZoom(1); setPanX(0); setPanY(0); } }, "Reset")
      )
    ),
    h("div", null,
      h("div", { className: "caps", style: { marginBottom: 8 } }, "Source image"),
      h("input", { ref: fileRef, type: "file", accept: "image/*", onChange: (e) => handleFile(e.target.files[0]), style: { display: "none" } }),
      h("button", { type: "button", className: "btn2", style: { marginTop: 0, padding: "11px 14px", borderStyle: "dashed", color: "var(--text)", fontSize: 13 }, onClick: () => fileRef.current?.click() }, sourceImg ? "Replace the image" : "Upload an image"),
      sourceImg && h("div", { className: "box mono small muted", style: { marginTop: 8 } }, sourceImg.width + " \u00d7 " + sourceImg.height),
      h("div", { className: "caps", style: { marginTop: 18, marginBottom: 8 } }, "Export"),
      processedUrl && h("button", { type: "button", className: "btn", style: { marginTop: 0, background: exported ? "#166534" : undefined }, onClick: () => { const a = document.createElement("a"); a.href = processedUrl; a.download = "startup_generic.png"; a.click(); setExported(true); if (!selected.has("splash-screen")) { const s = new Set(selected); s.add("splash-screen"); setSelected(s); } } }, exported ? "\u2713 Downloaded" : "Export startup_generic.png"),
      h("div", { className: "box", style: { marginTop: 12 } },
        h("div", { className: "caps", style: { marginBottom: 6 } }, "Notes"),
        h("ul", { className: "small muted", style: { margin: 0, padding: "0 0 0 14px", lineHeight: 1.7 } },
          h("li", null, "The exported PNG goes in splashscreens/ on the card"),
          h("li", null, "Exporting adds the Splash screen module to your card"),
          h("li", null, "It replaces the factory boot logo on install")
        )
      )
    )
  );

  return h("div", { style: { minHeight: "100vh" } },
    h("header", { className: "hdr" },
      h("div", { className: "hdr-row" },
        h("div", { className: "logo", "aria-hidden": "true" },
          h("span", { style: { height: 14, background: "#8a8a90" } }),
          h("span", { style: { height: 20, background: "#c41e3a" } }),
          h("span", { style: { height: 16, background: "#c41e3a" } })),
        h("span", { className: "name" }, "MMI3G-TOOLKIT"),
        h("span", { className: "grow" }),
        h("nav", { className: "tabs", "aria-label": "Sections" },
          [{ id: "modules", label: "Modules" }, { id: "splash", label: "Splash screen" }].map((t) =>
            h("button", { key: t.id, type: "button", className: tab === t.id ? "on" : "", "aria-current": tab === t.id ? "page" : undefined, onClick: () => setTab(t.id) }, t.label))),
        h("a", { className: "gh", href: repoUrl, target: "_blank", rel: "noopener" }, "GitHub \u2197")
      ),
      tab === "modules" && h("div", { className: "hdr-row" },
        h("input", { type: "search", className: "search", placeholder: "Search modules", "aria-label": "Search modules",
          value: query, spellCheck: false, onChange: (e) => setQuery(e.target.value) }),
        h("div", { className: "chips", role: "group", "aria-label": "Your car" },
          h("span", { className: "caps", style: { marginRight: 4 } }, "Your car"),
          MODELS.map((m) => h("button", { key: m.id, type: "button", className: "chip" + (model === m.id ? " on" : ""), "aria-pressed": model === m.id ? "true" : "false", onClick: () => setModel(m.id) }, m.label)))
      )
    ),
    tab === "modules" && h("div", { className: "layout" }, catalog, panel),
    tab === "modules" && h("div", { className: "mbar" },
      h("div", { className: "grow small" }, selected.size + " on your card \u00b7 " + sizeText),
      h("button", { type: "button", className: "btn", onClick: () => panelRef.current && panelRef.current.scrollIntoView({ behavior: "smooth" }) }, "Review and build")),
    tab === "splash" && splash,
    h("canvas", { ref: canvasRef, style: { display: "none" } })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
