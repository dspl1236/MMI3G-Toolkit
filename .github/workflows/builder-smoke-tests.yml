name: Builder Smoke Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.11'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run builder smoke tests
        run: python -m unittest discover -s tests -v

      # The on-device shell is QNX ksh88; dash (ubuntu /bin/sh) is not a
      # faithful proxy for the trap/wait/kill constructs the system-info
      # robustness fix relies on. mksh shares pdksh lineage — run those
      # tests under it too. (Necessary, not sufficient: still validate on
      # a real unit's /bin/ksh before shipping module-script changes.)
      - name: Run shell-robustness tests under mksh (pdksh-family)
        run: |
          sudo apt-get update && sudo apt-get install -y mksh
          MMI_TEST_SHELL="$(command -v mksh)" python -m unittest tests.test_system_info_robustness -v
